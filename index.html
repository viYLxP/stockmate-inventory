<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StockMate – bilingual (Arabic / English) inventory management prototype." />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>StockMate</title>
    <script>
      // Apply the saved language before first paint to avoid a direction flash.
      // Mirrors detectInitialLanguage() in src/i18n/config.ts.
      ;(function () {
        var lang = 'ar'
        try {
          var saved = localStorage.getItem('stockmate:language')
          if (saved === 'ar' || saved === 'en') lang = saved
          else if (/^(ar|en)/.test(navigator.language)) lang = navigator.language.slice(0, 2)
        } catch (e) {}
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p lang="en" dir="ltr">StockMate needs JavaScript enabled.</p>
      <p lang="ar" dir="rtl">يحتاج ستوك ميت إلى تفعيل JavaScript.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
